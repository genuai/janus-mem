name: ci
on:
  push:
  # Any PR base, not just main: a stacked PR is measured against its own base by
  # the pr-size job, which fetches origin/<base_ref>. Heavy jobs stay on push so
  # the run is not duplicated.
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
              rust:
                - '**/*.rs'
                - '**/Cargo.toml'
                - '**/Cargo.lock'
                - '**/janus.toml'
                - '**/rust-toolchain.toml'
                - 'tests/eval/**'
                - '.github/workflows/*.yml'

  test:
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  # Retrieval quality is a report, not a gate (§3.8, S-15). The job prints
  # `active-top-1` and `nDCG@10` with their denominators; `continue-on-error`
  # keeps a ranking experiment from failing the build. Milestone acceptance is a
  # human reading this log, recorded in the PR that changes the ranking.
  eval:
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Report active top-1 and nDCG@10
        run: cargo test --test eval_quality -- --ignored --nocapture

  # soft check - windows is not supported right now
  windows-compile:
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.rust == 'true' }}
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  # The one job allowed to reach the network, and it does so at *build* time:
  # `fastembed` -> `ort` fetches a prebuilt ONNX Runtime archive (§3.2, V-13).
  # `embeddings` is not a default feature, so the `test`, `eval` and `windows`
  # jobs above never compile it; this job is where the module is linted and
  # where its tests actually run, because the default suite cannot see either.
  # No test here loads a model: `tests/real_model.rs` is `#[ignore]`d and is
  # P5's acceptance step, run by hand against a real model directory.
  embeddings:
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: embeddings
      - run: cargo check --all-targets --features embeddings
      - run: cargo clippy --all-targets --features embeddings -- -D warnings
      - run: cargo test --all-targets --features embeddings

  # Enforces the PR size budget in AGENTS.md. Advisory instruction files are
  # read once at session start and then drift; a failing required check is a
  # fact that every session has to deal with. The ceiling gates the initial
  # submission: once a review exists the same numbers are reported as advisory,
  # because the ceiling protects a reviewer's attention and that reviewer has
  # already spent it.
  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - name: Check the large-pr escape hatch
        id: escape
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --json labels \
            --jq '.labels[].name')
          if grep -qx 'large-pr' <<< "$labels"; then
            echo "labelled=true" >> "$GITHUB_OUTPUT"
            echo "::warning::PR is labelled large-pr; the size check is advisory."
          else
            echo "labelled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check whether a review exists
        id: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --json reviews \
            --jq '.reviews | length')
          if (( count > 0 )); then
            echo "reviewed=true" >> "$GITHUB_OUTPUT"
          else
            echo "reviewed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Enforce size budget
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if [[ "${{ steps.escape.outputs.labelled }}" == "true" ]]; then
            ./scripts/pr-size.sh || echo "::warning::over budget, but large-pr is set"
          elif [[ "${{ steps.review.outputs.reviewed }}" == "true" ]]; then
            ./scripts/pr-size.sh --advisory
          else
            ./scripts/pr-size.sh
          fi
