name: release
# One artifact set per version tag. A tag is cut from main after a milestone
# merges, so the binaries carry a surface the tests have already passed.
#
# The `embeddings` feature is absent on purpose: `ort` fetches a prebuilt ONNX
# Runtime at build time, which a release runner may not do, and the lexical
# build is the one the Windows cross-check covers (§8.7).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The macOS runner is arm64 and also cross-builds the Intel target:
          # both SDKs ship with it, so one job serves both Macs.
          - os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag names this crate's version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not name crate version $version" >&2
            exit 1
          fi

      - name: Build and package each target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in ${{ matrix.targets }}; do
            cargo build --release --locked --target "$target"
            name="janus-${GITHUB_REF_NAME}-${target}"
            stage="$(mktemp -d)"
            if [ -f "target/${target}/release/janus.exe" ]; then
              cp "target/${target}/release/janus.exe" "${stage}/janus.exe"
            else
              cp "target/${target}/release/janus" "${stage}/janus"
            fi
            cp README.md LICENSE "${stage}/"
            tar -czf "dist/${name}.tar.gz" -C "$stage" .
            rm -rf "$stage"
          done

      - name: Write checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ./*.tar.gz > SHA256SUMS
          else
            shasum -a 256 ./*.tar.gz > SHA256SUMS
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
