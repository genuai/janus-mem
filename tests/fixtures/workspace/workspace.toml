# Fixture workspace: two corpora, one primary and one archived (M6b §3.1).
#
# The archived entry comes first on purpose. A listing must report the primary
# first whatever the file order is (§2.2), so a reader can see the rule work.
#
# Roots are relative, and resolve against this file's directory (M6b-8). A
# workspace can therefore be committed beside its corpora: the test copies the
# whole tree to a temporary directory and the roots follow it.
#
# Nothing here grants a write. `read_only` is left out of both entries, so the
# role decides it: archived is read-only, primary is not (case 1.4).
#
# The archived corpus keeps one active note and one superseded decision. A
# default `--corpus all` query therefore returns a row from each corpus with the
# archived weight beside its score, while the status gate still hides the
# retired decision: the role says when a corpus is read, and the status says
# whether a document is true now.

[[corpora]]
id = "context"
root = "archive"
role = "archived"

[[corpora]]
id = "main"
root = "primary"
role = "primary"

[search]
archived_weight = 0.8
allow_cross_corpus_links = false
