[package]
name = "janus-mem"
version = "0.2.1"
edition = "2024"

[[bin]]
name = "janus"
path = "src/main.rs"

[lib]
name = "janus_mem"
path = "src/lib.rs"

[dependencies]
# cli arg parser
clap = { version = "4.6.7", features = ["derive", "env"] }
# custom error types
thiserror = "2.0.21"
# instrumentation framework
tracing = "0.1.44"
# utilities for structured logging
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# deserializing
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# config parsing
toml = "1.1.8"
# frontmatter parsing
oneyaml = "1.2.0"
# for naive dates
chrono = { version = "0.4.45",  features = ["serde"] }
# to traverse corpus while ignoring patterns ignored by git
ignore = "0.4.34"
# find files using glob patterns
globset = "0.4.21"
# hashing
blake3 = "1.8.7"
# index.bin is a bincode sidecar by D13; 1.3.3 is serde-based, matching the
# existing serde/chrono derives. bincode 2's Encode/Decode would need newtype
# wrappers for chrono::NaiveDate, a second serialization path for a local cache.
bincode = "1.3.3"
# Windows path normalization
dunce = "1.0.5"
pulldown-cmark = { version = "0.13.6", default-features = false }
# `.janus/lock` (S-7). Locks a `File` handle directly, so the guard is a plain
# field; fd-lock's guard borrows its `RwLock` and cannot be stored without either
# `unsafe` (D12) or a self-referential wrapper crate.
fs4 = "1.1.0"
# unique per-writer temp files: a shared `index.bin.new` is itself a race.
tempfile = "3.27.0"

# The ONNX sentence-transformer of SPEC §7.2 behind the non-default `embeddings`
# feature. Optional because `fastembed` pulls `ort`, which fetches a prebuilt
# ONNX Runtime at build time and cannot be cross-compiled to Windows from macOS,
# so a lexical-only build must not pay for it (§8.2, V-13). The download path is
# `ort`'s, reached through `fastembed`'s own defaults; do not add
# `ort/download-binaries` here, and nothing at runtime downloads (§3.2).
fastembed = { version = "5.17.4", optional = true }

[features]
# Not default: the Windows cross-check and `cargo test` never compile it (V-13).
embeddings = ["dep:fastembed"]

[dev-dependencies]
# cli integration testing
assert_cmd = "2.2.2"
# for predicate functions
predicates = "3.1.4"
# snapshot testing
insta = "1.49.0"
proptest = "1"
